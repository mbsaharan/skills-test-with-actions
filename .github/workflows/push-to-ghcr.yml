name: Test GHCR Push

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to manually trigger this workflow from the Actions tab

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # Crucial: Gives GITHUB_TOKEN write access to push container images
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Log in to GitHub Container Registry using GITHUB_TOKEN
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 2: Pull a tiny, ready-to-use public image to test with
      - name: Pull sample Docker image
        run: docker pull alpine:latest

      # Step 3: Re-tag the public image to point to your GHCR target path
      - name: Tag image for GHCR
        run: docker tag alpine:latest ghcr.io/${{ github.repository_owner }}/my-test-image:latest

      # Step 4: Push the image up to your GitHub Packages storage
      - name: Push image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/my-test-image:latest
