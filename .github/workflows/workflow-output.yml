name: Workflow Output Example

on: push

jobs:
  job_1:
    runs-on: ubuntu-latest
    outputs:
      my_greeting: ${{steps.step1.outputs.message}}

    steps:
      - name: Create the data
        id: step1
        run: echo "message=Hello World" >> $GITHUB_OUTPUT

  job_2:
    runs-on: ubuntu-latest
    needs: job_1
    steps:
      - name: Read the data
        run: echo "${{ needs.job_1.outputs.my_greeting }}"
