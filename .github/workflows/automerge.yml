# automerge.yml
name: Auto Merge on Label

on:
  pull_request:
    types: [labeled]

jobs:
  merge:
    # Only run if the newly added label is 'approved'
    if: github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    steps:
      - name: Merge PR
        uses: pascalgn/automerge-action@v0.16.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
